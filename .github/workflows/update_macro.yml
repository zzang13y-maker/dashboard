name: Update market macro
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,6,12,18 * * *'
permissions:
  contents: write
concurrency:
  group: market-macro
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch FRED data
        run: python3 update_macro.py
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market_macro.json
          if git diff --cached --quiet; then
            echo 'No new data'
          else
            git commit -m 'Update VIX and HY spread'
            git push
          fi
